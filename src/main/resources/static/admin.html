<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <title>Admin – Bokningar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f7f7f7;
        }

        h1 {
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #333;
            color: white;
        }

        tr:hover {
            background: #f0f0f0;
        }

        .refresh-btn {
            display: block;
            width: 100%;
            padding: 12px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            margin-top: 10px;
        }
    </style>
</head>

<body>
<h1>Alla bokningar</h1>

<button class="refresh-btn" onclick="loadBookings()">Uppdatera</button>

<table id="bookingTable">
    <thead>
    <tr>
        <th>ID</th>
        <th>Namn</th>
        <th>Email</th>
        <th>Typ</th>
        <th>Antal</th>
        <th>Datum</th>
    </tr>
    </thead>
    <tbody></tbody>
</table>

<script src="admin.js"></script>
</body>
</html>
